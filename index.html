<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>តារាងតម្លៃបោះដុំនិងលក់រាយ 零售批发价 - DADING SHOP</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- QRCode JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Kantumruy Pro', 'Noto Sans SC', sans-serif; 
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
        }
        select, option, input, button {
            font-family: 'Kantumruy Pro', 'Noto Sans SC', sans-serif !important;
        }
        .category-item.active { 
            background-color: #0f172a !important; 
            color: #ffffff !important; 
            border-color: #0f172a !important;
            box-shadow: 0 4px 10px -2px rgba(15, 23, 42, 0.3); 
        }
        .product-card { 
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .product-card:active {
            transform: scale(0.98);
        }
        @media (min-width: 768px) {
            .product-card:hover { 
                transform: translateY(-3px); 
                border-color: #f97316; 
                box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.08);
            }
        }
        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .animate-zoom { animation: zoomIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden bg-slate-50 text-slate-800">
    <!-- HEADER -->
    <header class="bg-slate-900 text-white shadow-md z-40 shrink-0 border-b border-slate-800">
        <div class="flex items-center justify-between px-3 md:px-6 py-2.5 max-w-7xl mx-auto w-full">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 sm:w-10 sm:h-10 bg-gradient-to-tr from-red-600 to-orange-500 rounded-xl flex items-center justify-center font-extrabold text-lg text-white shadow-md">D</div>
                <div>
                    <h1 class="font-extrabold text-sm sm:text-base leading-tight tracking-tight text-white">DADING SHOP</h1>
                    <p class="text-[9px] sm:text-[10px] text-slate-400 font-medium tracking-wide">តារាងតម្លៃបោះដុំនិងលក់រាយ 零售批发价</p>
                </div>
            </div>
            <!-- ប៊ូតុងទំនាក់ទំនងផ្នែកលក់ -->
            <button onclick="openContactModal()" class="py-1.5 px-3 sm:px-4 bg-slate-800 hover:bg-slate-700 text-emerald-400 rounded-xl transition flex items-center gap-1.5 text-xs font-semibold border border-slate-700 shadow-sm active:scale-95">
                <i class="fa-brands fa-telegram text-base sm:text-lg"></i>
                <span class="hidden sm:inline">ទំនាក់ទំនងផ្នែកលក់</span>
                <span class="inline sm:hidden">ទំនាក់ទំនង</span>
            </button>
        </div>
    </header>

    <!-- SEARCH CONTAINER -->
    <div class="bg-white border-b border-slate-200 py-2.5 px-3 md:px-6 shrink-0 shadow-sm">
        <div class="max-w-7xl mx-auto w-full">
            <div class="relative group w-full md:max-w-md">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs sm:text-sm"></i>
                <input type="text" id="search-box" 
                       placeholder="ស្វែងរកឈ្មោះ ឬលេខកូដ... 搜索名称或代码……" 
                       class="w-full pl-9 pr-8 py-2 sm:py-2.5 rounded-xl border border-slate-200 focus:border-orange-500 focus:ring-2 focus:ring-orange-400/20 outline-none text-xs sm:text-sm font-medium transition-all bg-slate-50/50 focus:bg-white"
                       oninput="handleSearch()">
                <button id="clear-search" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-circle-xmark text-xs sm:text-sm"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP STRUCTURE -->
    <div class="flex flex-1 overflow-hidden max-w-7xl mx-auto w-full">
        
        <!-- SIDEBAR Categories (កែសម្រួលទំហំឱ្យល្មមស្អាតលើ Mobile មិនទើសភ្នែក) -->
        <aside id="category-bar" class="w-20 sm:w-28 md:w-60 bg-white border-r border-slate-200/80 overflow-y-auto p-1.5 sm:p-2 md:p-3 shrink-0 select-none">
            <div class="text-[9px] md:text-[10px] font-bold text-slate-400 mb-2 px-1 uppercase tracking-wider border-b border-slate-100 pb-1 hidden sm:block">ប្រភេទ 类别</div>
            <div id="category-list" class="space-y-1">
                <!-- Dynamic categories loading... -->
                <div class="animate-pulse space-y-1">
                    <div class="h-8 bg-slate-100 rounded-lg"></div>
                    <div class="h-8 bg-slate-100 rounded-lg"></div>
                    <div class="h-8 bg-slate-100 rounded-lg"></div>
                </div>
            </div>
        </aside>

        <!-- PRODUCTS GRID ( grid-cols-2 លើទូរស័ព្ទ រូបភាពសមមាត្រ aspect-square មិនរីកធំខុសទម្រង់) -->
        <main id="app-container" class="flex-1 overflow-y-auto p-2 sm:p-3 md:p-4 space-y-6 bg-slate-50">
            <!-- Dynamic products grouped by category go here -->
            <div class="flex flex-col items-center justify-center h-64 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-orange-500 mb-2"></i>
                <p class="text-xs font-medium">កំពុងផ្ទុកទិន្នន័យ... 正在加载数据...</p>
            </div>
        </main>
        
    </div>

    <!-- TELEGRAM CONTACT MODAL -->
    <div id="contact-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm hidden z-[110] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl relative animate-zoom border border-slate-100">
            <!-- Close Button -->
            <button onclick="closeContactModal()" class="absolute top-3.5 right-3.5 text-slate-400 hover:text-slate-600 text-lg w-8 h-8 rounded-full flex items-center justify-center bg-slate-100 transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <!-- Modal Header -->
            <div class="text-center mb-5">
                <div class="w-12 h-12 bg-sky-100 text-sky-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-2">
                    <i class="fa-brands fa-telegram"></i>
                </div>
                <h2 class="text-base font-bold text-slate-900">ទំនាក់ទំនងមកយើងខ្ញុំ</h2>
                <p class="text-xs text-slate-500 mt-0.5">សូមជ្រើសរើសគណនីតេឡេក្រាមខាងក្រោម</p>
            </div>
            
            <!-- Telegram Accounts List -->
            <div class="space-y-3">
                <div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">គណនីផ្លូវការ (Official Account)</span>
                    <a href="https://t.me/dading_boss" target="_blank" class="w-full bg-sky-500 hover:bg-sky-600 text-white py-2.5 px-3.5 rounded-xl font-bold flex items-center justify-between shadow-sm active:scale-95 transition-all text-xs">
                        <span class="flex items-center gap-2">
                            <i class="fa-brands fa-telegram text-lg"></i>
                            DADING Boss
                        </span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-80"></i>
                    </a>
                </div>
                
                <div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">ផ្នែកលក់ និងព័ត៌មានបន្ថែម</span>
                    <a href="https://t.me/DaDingStore_Media" target="_blank" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 py-2.5 px-3.5 rounded-xl font-semibold flex items-center justify-between active:scale-95 transition-all text-xs border border-slate-200/60">
                        <span class="flex items-center gap-2">
                            <i class="fa-brands fa-telegram text-base text-sky-500"></i>
                            DaDing Store Media
                        </span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-2.5 rounded-full shadow-2xl flex items-center gap-2.5 z-[110] transform translate-y-20 opacity-0 transition-all duration-300 w-max max-w-[90%] text-xs border border-slate-800">
        <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
        <span id="toast-msg" class="font-medium">ជោគជ័យ</span>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/1iXLoDPlNtwBr-jfIR8Nd73dxarb9kfv5o3r3MCRCqIo/gviz/tq?tqx=out:csv';
        let allData = [];
        let currentCategory = 'ទាំងអស់ 全部';

        /* មុខងារកែប្រែតំណភ្ជាប់ Google Drive ឱ្យទាញយករូបភាពផ្ទាល់បានលឿន និងច្បាស់ល្អ */
        function formatImageUrl(url) {
            if (!url) return '';
            let cleanUrl = url.trim();
            
            if (cleanUrl.includes('drive.google.com')) {
                let id = '';
                if (cleanUrl.includes('id=')) {
                    id = cleanUrl.split('id=')[1].split('&')[0];
                } else if (cleanUrl.includes('/file/d/')) {
                    id = cleanUrl.split('/file/d/')[1].split('/')[0];
                }
                if (id) {
                    // លីងផ្លូវការសម្រាប់ Bypassing Google Drive view constraint
                    return `https://lh3.googleusercontent.com/d/${id}`;
                }
            }
            return cleanUrl;
        }

        /* មុខងារទាញយកទិន្នន័យពី Google Sheets */
        async function fetchSheetData() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Network error');
                const data = await response.text();
                const lines = data.split('\n');
                
                allData = lines.slice(1).filter(line => line.trim() !== "").map(line => {
                    const row = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, '').trim());
                    return { 
                        name: row[0] || 'គ្មានឈ្មោះ',
                        code: row[1] || '-',
                        variant: row[2] || '',
                        salePrice: row[3] || '0',
                        vipPrice: row[4] || '0',
                        category: row[5] || 'ផ្សេងៗ',
                        inStock: row[6] !== '0', 
                        priceUpdate: row[7] === '1', // boolean
                        newStock: row[8] === '1',    // boolean
                        image: formatImageUrl(row[10] || ''),
                    };
                });

                renderCategories();
                renderProductList(allData);
            } catch (e) {
                console.error("កំហុសក្នុងការអានទិន្នន័យ:", e);
                document.getElementById('app-container').innerHTML = `
                    <div class="col-span-full text-center text-red-500 py-12 px-4 bg-white rounded-2xl border border-red-100 shadow-sm">
                        <i class="fa-solid fa-circle-exclamation text-3xl mb-2 text-red-400"></i>
                        <p class="text-xs font-semibold">មិនអាចផ្ទុកទិន្នន័យបានទេ។ សូមពិនិត្យមើលអ៊ីនធឺណិត ឬសាកល្បងម្ដងទៀត!</p>
                        <button onclick="fetchSheetData()" class="mt-3 px-4 py-1.5 bg-red-50 text-red-600 rounded-lg text-xs font-bold border border-red-200 active:scale-95">សាកល្បងឡើងវិញ</button>
                    </div>`;
            }
        }

        /* មុខងារបង្ហាញបញ្ជីប្រភេទទំនិញ (Categories) */
        function renderCategories() {
            const uniqueCats = [...new Set(allData.map(i => i.category).filter(c => c))];
            const categories = ['ទាំងអស់ 全部', 'ទំនិញថ្មី 新货', ...uniqueCats];
            
            const catList = document.getElementById('category-list');
            if (catList) {
                catList.innerHTML = categories.map(cat => {
                    const isActive = cat === currentCategory;
                    return `
                    <button onclick="filter('${cat}', this)" 
                            class="category-item w-full text-left px-2 sm:px-2.5 py-2 text-[10px] sm:text-xs font-medium rounded-xl transition-all flex items-center justify-between border ${isActive ? 'active' : 'border-transparent text-slate-600 hover:bg-slate-100'}" 
                            data-cat="${cat}">
                        <span class="truncate leading-tight">${cat}</span>
                    </button>
                    `;
                }).join('');
            }
        }

        /* មុខងារចម្រោះប្រភេទទំនិញ */
        function filter(cat, btn) {
            currentCategory = cat;
            
            document.querySelectorAll('.category-item').forEach(el => {
                el.classList.remove('active');
                el.className = "category-item w-full text-left px-2 sm:px-2.5 py-2 text-[10px] sm:text-xs font-medium rounded-xl transition-all flex items-center justify-between border border-transparent text-slate-600 hover:bg-slate-100";
                if (el.getAttribute('data-cat') === cat) {
                    el.classList.add('active');
                    el.className = "category-item active w-full text-left px-2 sm:px-2.5 py-2 text-[10px] sm:text-xs font-medium rounded-xl transition-all flex items-center justify-between border shadow-sm";
                }
            });
            handleSearch();
        }

        /* មុខងារស្វែងរក Search */
        function handleSearch() {
            const searchInput = document.getElementById('search-box');
            const clearBtn = document.getElementById('clear-search');
            const searchTerm = searchInput.value.toLowerCase().trim();

            if (searchTerm.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            const filtered = allData.filter(item => {
                let matchesCategory = (currentCategory === 'ទាំងអស់ 全部') ? true : 
                                     (currentCategory === 'ទំនិញថ្មី 新货') ? item.newStock : 
                                     (item.category === currentCategory);
                const matchesSearch = (item.name.toLowerCase().includes(searchTerm) || item.code.toLowerCase().includes(searchTerm));
                return matchesCategory && matchesSearch;
            });
            renderProductList(filtered);
        }

        function clearSearch() {
            document.getElementById('search-box').value = '';
            document.getElementById('clear-search').classList.add('hidden');
            handleSearch();
        }

        /* មុខងារបង្ហាញបញ្ជីទំនិញ (Render Product Grid) */
        function renderProductList(items) {
            const container = document.getElementById('app-container');
            container.innerHTML = '';

            if (!items || items.length === 0) {
                container.innerHTML = `
                <div class="text-center text-slate-400 py-16 flex flex-col items-center justify-center">
                    <i class="fa-solid fa-box-open text-4xl mb-3 text-slate-300"></i>
                    <p class="text-xs font-medium">រកមិនឃើញទំនិញទេ 找不到商品</p>
                </div>`;
                return;
            }

            // បែងចែកទំនិញជាក្រុមតាម Category
            const groups = {};
            items.forEach(item => {
                const cat = item.category || 'ផ្សេងៗ';
                if (!groups[cat]) groups[cat] = [];
                groups[cat].push(item);
            });

            Object.keys(groups).forEach(cat => {
                const sectionItems = groups[cat];
                const sectionDiv = document.createElement('div');
                sectionDiv.className = "space-y-2.5";
                
                sectionDiv.innerHTML = `
                    <!-- Category Title -->
                    <div class="flex items-center gap-2 border-l-4 border-orange-500 pl-2 py-0.5">
                        <h2 class="text-xs sm:text-sm font-bold text-slate-800">${cat}</h2>
                        <span class="text-[10px] font-semibold text-slate-400 bg-slate-200/60 px-1.5 py-0.2 rounded-md">${sectionItems.length}</span>
                    </div>

                    <!-- Grid Layout : 2 columns on Mobile, 3-4 on Desktop -->
                    <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 sm:gap-3">
                        ${sectionItems.map(item => {
                            const isOutOfStock = !item.inStock;
                            return `
                            <div class="product-card bg-white p-2 sm:p-2.5 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between relative ${isOutOfStock ? 'opacity-65' : ''}">
                                
                                <div>
                                    <!-- Product Image (Aspect Square) -->
                                    <div class="relative aspect-square w-full rounded-xl overflow-hidden bg-slate-100 border border-slate-100 mb-2 group">
                                        ${item.image ? 
                                            `<img src="${item.image}" 
                                                  alt="${item.name}" 
                                                  loading="lazy"
                                                  class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" 
                                                  onerror="this.onerror=null; this.src='https://placehold.co/300x300/f1f5f9/94a3b8?text=No+Image';">` : 
                                            `<div class="w-full h-full flex flex-col items-center justify-center bg-slate-100 text-slate-300"><i class="fa-solid fa-image text-2xl"></i></div>`
                                        }
                                        
                                        <!-- Status Badges Overlay -->
                                        <div class="absolute top-1 left-1 flex flex-col gap-1 z-10 pointer-events-none">
                                            ${item.newStock ? '<span class="text-[8px] font-bold text-white bg-red-500 px-1.5 py-0.5 rounded-md shadow-sm">新货 អីវ៉ាន់ថ្មី</span>' : ''}
                                            ${item.priceUpdate ? '<span class="text-[8px] font-bold text-white bg-blue-500 px-1.5 py-0.5 rounded-md shadow-sm">新价 តម្លៃថ្មី</span>' : ''}
                                            ${isOutOfStock ? '<span class="text-[8px] font-bold text-white bg-slate-700 px-1.5 py-0.5 rounded-md shadow-sm">没货 អស់ស្តុក</span>' : ''}
                                        </div>
                                    </div>

                                    <!-- Product Info -->
                                    <h3 class="font-bold text-slate-800 text-[11px] sm:text-xs leading-snug line-clamp-2 h-7 sm:h-8 mb-1" title="${item.name}">${item.name}</h3>
                                    
                                    <div class="flex items-center justify-between text-[9px] sm:text-[10px] text-slate-400 mb-1.5">
                                        <span class="truncate">${item.variant || '-'}</span>
                                        <span class="font-mono text-orange-600 bg-orange-50 px-1 rounded border border-orange-100 shrink-0">ID: ${item.code}</span>
                                    </div>
                                </div>

                                <!-- Price Section -->
                                <div class="pt-1.5 border-t border-slate-100 mt-auto">
                                    <div class="flex items-baseline justify-between">
                                        <span class="text-[9px] text-slate-400">តម្លៃរាយ:</span>
                                        <span class="text-xs sm:text-sm font-extrabold text-slate-900">$${item.salePrice}</span>
                                    </div>
                                    ${item.vipPrice && item.vipPrice !== '0' ? `
                                    <div class="flex items-baseline justify-between text-orange-600 font-semibold">
                                        <span class="text-[9px]">តម្លៃបោះដុំ:</span>
                                        <span class="text-xs sm:text-sm font-black">$${item.vipPrice}</span>
                                    </div>` : ''}
                                </div>

                            </div>
                            `;
                        }).join('')}
                    </div>
                `;
                container.appendChild(sectionDiv);
            });
        }

        /* មុខងារគ្រប់គ្រង Contact Modal */
        function openContactModal() {
            document.getElementById('contact-modal').classList.remove('hidden');
        }
        function closeContactModal() {
            document.getElementById('contact-modal').classList.add('hidden');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
        }

        // ចាប់ផ្តើមទាញយកទិន្នន័យនៅពេលទំព័រ Load
        window.onload = fetchSheetData;
    </script>
